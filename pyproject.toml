[project]
name = "seismic-view"
version = "0.3.0"
description = "Desktop application for loading, viewing, and comparing 2D/3D reflection seismic data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.0",
    "scipy>=1.17.1",
    "segyio>=1.9.14",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[project.scripts]
seismic-view = "seisvis.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seisvis"]
